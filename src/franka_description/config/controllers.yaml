# Controller configuration for the Panda ros2_control system.
#
# Joint names assume the default (empty) prefix.  Regenerate or override this
# file when using panda.urdf.xacro with prefix:=<something>.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: position_controllers/GripperActionController


panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0


panda_hand_controller:
  ros__parameters:
    # finger_joint2 is a mimic of finger_joint1 and is not commanded directly.
    joint: panda_finger_joint1
